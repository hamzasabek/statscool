<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Tab and home-screen icons (logo v3, Step 105; made by design/logo/make_logos.py and rasterize.mjs) -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>StatsCool: statistics for psychology and neuroscience</title>
    <meta name="description" content="StatsCool: statistics for psychology and neuroscience. Learn statistics through short games built on classic psychology and neuroscience experiments." />
    <script>
      // Theme and language before the first paint (no flash): saved choice, else the system /
      // browser setting. Kept in sync by src/theme.js and src/i18n.jsx.
      (function () {
        var t = null, l = null
        try { t = localStorage.getItem('statscool-theme') || localStorage.getItem('statcool-theme'); l = localStorage.getItem('statscool-lang') || localStorage.getItem('statcool-lang') } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        if (l !== 'en' && l !== 'fr') l = (navigator.language || '').toLowerCase().indexOf('fr') === 0 ? 'fr' : 'en'
        document.documentElement.dataset.theme = t
        document.documentElement.dataset.bsTheme = t
        document.documentElement.lang = l
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
