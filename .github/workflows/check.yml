name: Check every page

# npm run check (tools/check.mjs): citations, search, licences, then every page in headless Chrome at two sizes and in
# English and French (console errors, KaTeX errors, horizontal scroll, page not found). Runs beside the deploy, so a
# failure shows a red cross on the commit without stopping the site from being published (Step 116).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  IBM_TELEMETRY_DISABLED: 'true'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check every page
        run: npm run check
